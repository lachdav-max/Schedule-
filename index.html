<meta charset="utf-8">
<script>
/* ===== SETTINGS: edit here. Everything below this block is the page itself. ===== */
const SCHEDULE = [
  // instruction: shown in the pill on a green card from the 15-minute warning. No instruction = "Coming Up Soon".
  // date: "YYYY-MM-DD" = only on that date (e.g. a haircut). No date = every day.
  // days: ["Mon", "Thu"] = only on those weekdays. No days = every day.
  { time: "07:00", name: "Nurse's station", instruction: "Go Downstairs Now" },
  { time: "07:30", name: "Breakfast",       instruction: "Go Downstairs Now" },
  // reassure: true = while waiting, a REASSURE message (below) shows under the countdown
  { time: "11:15", name: "Lunch",           instruction: "Go Downstairs Now", reassure: true },
  { time: "14:00", name: "Afternoon meds",  instruction: "Go Downstairs Now" },
  { time: "16:15", name: "Supper",          instruction: "Go Downstairs Now", reassure: true },
  // message: "..." = this item's own line under the countdown, shown whenever it's on the card
  { time: "19:00", name: "Mark's Sing Song",  message: "See if Mark is having a sing song tonight." },
  { time: "20:00", name: "Nighttime meds" },
  // One-off items (each shows only on its date)
  { time: "12:30", name: "Haircut",          instruction: "Go Downstairs Now", date: "2026-10-21" },
];
const NOW_MINUTES = 15;   // how long an item shows as "Now"
const SOON_MINUTES = 15;  // warning before an item

// Waiting messages for items with reassure: true. First match wins.
const REASSURE = [
  { moreThan: 30, text: "Plenty of Time. Relax." },  // more than 30 minutes away
  { moreThan: 15, text: "Soon. Get Ready." },        // 15 to 30 minutes away
];

// Lists under the main card: true = show, false = hide
const SHOW_DONE = true;      // "Done today"
const SHOW_LATER = true;     // "Later today"
const SHOW_TOMORROW = false; // "Tomorrow" (and "Later tomorrow" once today's items are finished)
const SHOW_UPCOMING = true;  // "Not Today": every future item that has a date
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }

<title>Today's Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout: one big card for the next item; the rest of the day trails beneath (beside, on a wide iPad) as a faint path that fades with distance. */
:root {
  --bg: #e9eff2;
  --ink: #13263a;
  --muted: #56687a;
  --faint: #8d9cab;
  --card: #ffffff;
  --wait-bg: #24548f;
  --wait-ink: #ffffff;
  --line: #c9d4dc;
  --soon-bg: #f3b433;
  --soon-ink: #2a1c00;
  --now-bg: #1d6a4c;
  --now-ink: #ffffff;
  --display: "Lexend", "Atkinson Hyperlegible", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1820; --ink: #e9eff4; --muted: #9fb0bf; --faint: #66798a;
    --card: #1a2632; --line: #2c3a47;
    --wait-bg: #2d63ab; --wait-ink: #ffffff;
    --soon-bg: #e8a92a; --soon-ink: #1f1500;
    --now-bg: #2a8a62; --now-ink: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1820; --ink: #e9eff4; --muted: #9fb0bf; --faint: #66798a;
  --card: #1a2632; --line: #2c3a47;
  --wait-bg: #2d63ab; --wait-ink: #ffffff;
  --soon-bg: #e8a92a; --soon-ink: #1f1500;
  --now-bg: #2a8a62; --now-ink: #ffffff;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
.app {
  box-sizing: border-box;
  height: 100%;
  padding-inline: clamp(16px, 4vw, 40px);
  padding-block: clamp(12px, 3vh, 32px);
  display: grid;
  grid-template-rows: auto auto 1fr;
  grid-template-columns: minmax(0, 1fr);
  gap: clamp(14px, 3vh, 28px);
  max-width: 1200px;
  margin-inline: auto;
}

/* Clock */
.clock {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 12px; white-space: nowrap; line-height: 1.1;
  font-family: var(--display); font-weight: 500;
  color: var(--muted);
  font-size: clamp(1.4rem, 5vw, 2.2rem);
}
.clock .time { font-variant-numeric: tabular-nums; }

/* Primary card */
.card {
  background: var(--wait-bg);
  color: var(--wait-ink);
  border-radius: 28px;
  min-width: 0;
  padding: clamp(22px, 5vw, 48px);
  display: grid; gap: clamp(10px, 2vh, 18px);
  box-shadow: 0 1px 0 var(--line), 0 18px 40px -24px rgba(19, 38, 58, .35);
  transition: background-color .6s ease, color .6s ease;
}
.card.soon { background: var(--soon-bg); color: var(--soon-ink); }
.card.now, .card.go { background: var(--now-bg); color: var(--now-ink); }

.tag {
  justify-self: stretch;
  display: block; text-align: center; white-space: nowrap;
  min-width: 0; overflow: hidden;
  font-family: var(--display); font-weight: 700;
  font-size: 2rem; /* replaced by fitTag() */
  line-height: 1.15;
  letter-spacing: 0;
  padding: .12em .5em; border-radius: 999px;
  background: var(--wait-ink); color: var(--wait-bg);
}
.card.soon .tag { background: var(--soon-ink); color: var(--soon-bg); }
.card.now .tag, .card.go .tag { background: var(--now-ink); color: var(--now-bg); }

.headline { display: flex; align-items: center; gap: clamp(12px, 3vw, 24px); min-width: 0; }
.icon { flex: none; width: clamp(56px, 14vw, 110px); height: clamp(56px, 14vw, 110px); }
.icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.name {
  margin: 0; min-width: 0;
  font-family: var(--display); font-weight: 700;
  font-size: clamp(2.5rem, 11vw, 6.2rem);
  line-height: 1.02; letter-spacing: -.01em;
  text-wrap: balance;
}
.when {
  font-size: clamp(1.4rem, 5vw, 2.4rem);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.countdown {
  font-family: var(--display); font-weight: 600;
  font-size: clamp(1.9rem, 8vw, 4.2rem);
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

.calm {
  font-family: var(--display); font-weight: 500;
  font-size: clamp(1.4rem, 5vw, 2.4rem);
  line-height: 1.15;
  text-wrap: balance;
}

/* The rest of the day: present but quiet */
.primary { display: grid; gap: clamp(14px, 3vh, 28px); min-width: 0; align-content: start; }
.done { min-width: 0; padding-left: 4px; }
.later { min-height: 0; overflow: hidden; padding-left: 4px; }
.later h2, .done h2 {
  margin: 0 0 10px;
  font-family: var(--body); font-weight: 400;
  font-size: 1rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--faint);
}
.path { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.path + h2 { margin-top: 22px; }
.path li {
  display: flex; gap: 14px; align-items: baseline;
  color: var(--faint);
  font-size: clamp(1rem, 3.4vw, 1.25rem);
}
.path .t { font-variant-numeric: tabular-nums; min-width: 5.2em; }
/* "Not Today": same muted text as Later Today, two lines per event */
.path.upcoming { gap: 14px; }
.path.upcoming li { display: grid; gap: 2px; }

@media (min-width: 900px) and (orientation: landscape) {
  /* Wide screens: card fixed on the left; Done, Later, Tomorrow read in order down the right */
  .app { grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); grid-template-rows: auto auto 1fr; align-items: start; }
  .primary { display: contents; }
  .clock { grid-column: 1 / -1; }
  .card { grid-column: 1; grid-row: 2 / 4; }
  .done { grid-column: 2; grid-row: 2; padding-top: 12px; }
  .later { grid-column: 2; grid-row: 3; padding-top: 12px; align-self: stretch; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>

</head>
<body>
<main class="app">
  <div class="clock" id="clock" aria-live="off">
    <span id="day">Today is Saturday</span>
  </div>

  <div class="primary">
    <section class="done" id="doneWrap" hidden></section>
    <section class="card" id="card" aria-live="polite">
      <span class="tag" id="tag">Next</span>
      <h1 class="name" id="name">Nurse's station</h1>
      <div class="when" id="when">At 7:00 am</div>
      <div class="countdown" id="countdown">in 13 minutes</div>
      <div class="calm" id="calm" hidden></div>
    </section>
  </div>

  <section class="later" id="laterWrap"></section>
</main>

<script>
/* ===== Logic ===== */
function atTime(base, hhmm, dayOffset) {
  const [h, m] = hhmm.split(":").map(Number);
  const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + dayOffset, h, m, 0, 0);
  return d;
}
const MIN = 60000;

/* The items that apply on a given day: every-day items plus any matching date or weekday */
const DAY_ABBR = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function ymd(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function itemsFor(day) {
  const key = ymd(day), dow = DAY_ABBR[day.getDay()];
  return SCHEDULE
    .filter(s => (!s.date || s.date === key) && (!s.days || s.days.includes(dow)))
    .sort((a, b) => a.time.localeCompare(b.time));
}
function tomorrowOf(now) { return new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1); }

function computeState(now) {
  const items = itemsFor(now);
  const tItems = itemsFor(tomorrowOf(now));
  const today = items.map((s, i) => ({ ...s, i, at: atTime(now, s.time, 0), day: 0 }));
  let next = today.find(s => s.at > now);
  if (!next) next = { ...tItems[0], i: 0, at: atTime(now, tItems[0].time, 1), day: 1 };
  const listOf = it => it.day === 1 ? tItems : items;

  // Warning for the next item wins over any "Now"
  if (next.at - now <= SOON_MINUTES * MIN) {
    return { mode: "soon", item: next, rest: restAfter(listOf(next), next), restDay: next.day };
  }
  const current = [...today].reverse().find(s => s.at <= now && now - s.at < NOW_MINUTES * MIN);
  if (current) {
    return { mode: "now", item: current, rest: restAfter(items, current), restDay: 0 };
  }
  return { mode: next.day === 1 ? "tomorrow" : "next", item: next, rest: restAfter(listOf(next), next), restDay: next.day };
}
function restAfter(items, item) { return items.slice(item.i + 1); }

function fmtTime(hhmm) {
  let [h, m] = hhmm.split(":").map(Number);
  const ap = h < 12 ? "am" : "pm";
  h = h % 12 || 12;
  return h + ":" + String(m).padStart(2, "0") + " " + ap;
}
function fmtCountdown(ms) {
  const total = Math.max(1, Math.ceil(ms / MIN));
  const h = Math.floor(total / 60), m = total % 60;
  const parts = [];
  if (h) parts.push(h + (h === 1 ? " hour" : " hours"));
  if (m) parts.push(m + (m === 1 ? " minute" : " minutes"));
  return "in " + parts.join(" ");
}

/* ===== Render ===== */
const $ = id => document.getElementById(id);
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let lastKey = "";

function render() {
  const now = new Date();
  $("day").textContent = "Today is " + DAYS[now.getDay()];

  const st = computeState(now);
  const card = $("card");
  const go = st.mode === "soon" && st.item.instruction;
  card.className = "card " + (go ? "go" : st.mode === "soon" ? "next" : st.mode);
  const showInstr = (st.mode === "soon" || st.mode === "now") && st.item.instruction;
  let calm = st.item.message || null;
  if (!calm && (st.mode === "next" || st.mode === "tomorrow") && st.item.reassure) {
    const left = (st.item.at - now) / MIN;
    const m = REASSURE.find(r => left > r.moreThan);
    if (m) calm = m.text;
  }
  $("tag").textContent = showInstr ? st.item.instruction
    : { next: "Next", soon: "Coming Up Soon", now: "Now", tomorrow: "Tomorrow" }[st.mode];
  $("calm").textContent = calm || "";
  $("calm").hidden = !calm;
  $("name").textContent = st.item.name;
  $("when").textContent = "At " + fmtTime(st.item.time);
  // Keep the line's space during "Now" so nothing moves
  $("countdown").textContent = st.mode === "now" ? " " : fmtCountdown(st.item.at - now);

  const key = now.toDateString() + st.item.time + st.mode;
  if (key !== lastKey) {
    lastKey = key;
    const sorted = itemsFor(now);
    // Done = today's items whose time has passed and that are no longer on the main card
    const onCard = s => st.item.day === 0 && st.item.time === s.time;
    const done = sorted.filter(s => atTime(now, s.time, 0) <= now && !onCard(s));
    // "Done today" sits above the main card so the page reads in time order
    const showDone = SHOW_DONE && done.length > 0;
    $("doneWrap").innerHTML = showDone
      ? '<h2>Already Done Today</h2><ol class="path">' + done.map(s =>
          '<li style="opacity:0.50"><span class="t">' + fmtTime(s.time) + '</span><span>' + s.name + '</span></li>').join("") + "</ol>"
      : "";
    $("doneWrap").hidden = !showDone;
    const sections = [];
    if (st.restDay === 0) {
      if (SHOW_LATER && st.rest.length) sections.push({ title: "Later today", items: st.rest });
      if (SHOW_TOMORROW) sections.push({ title: "Tomorrow", items: itemsFor(tomorrowOf(now)) });
    } else if (SHOW_TOMORROW && st.rest.length) {
      sections.push({ title: "Later tomorrow", items: st.rest });
    }
    // Later Today and Not Today: no fading; items use the same muted grey as the headings
    let html = sections.map(sec =>
      "<h2>" + sec.title + '</h2><ol class="path">' + sec.items.map(s =>
        '<li><span class="t">' + fmtTime(s.time) + '</span><span>' + s.name + '</span></li>'
      ).join("") + "</ol>"
    ).join("");
    // "Not Today": every one-off (dated) item after today, however far ahead
    const ups = SHOW_UPCOMING ? upcomingAfter(now) : [];
    if (ups.length) {
      html += '<h2>Not Today</h2><ol class="path upcoming">' + ups.map(u =>
        '<li><span class="ev-name">' + u.name + " " + u.rel + '</span><span class="ev-when">' + u.when + "</span></li>").join("") + "</ol>";
    }
    $("laterWrap").innerHTML = html;
    $("laterWrap").hidden = html === "";
    fitLater();
  }
}

/* Future one-off items, soonest first, with their full date and how many days away */
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function upcomingAfter(now) {
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return SCHEDULE.filter(s => s.date)
    .map(s => {
      const [y, mo, d] = s.date.split("-").map(Number);
      const day = new Date(y, mo - 1, d);
      const diff = Math.round((day - today) / 86400000);
      return { ...s, day, diff };
    })
    .filter(u => u.diff >= 1)
    .sort((a, b) => a.day - b.day || a.time.localeCompare(b.time))
    .map(u => ({
      name: u.name,
      rel: u.diff === 1 ? "tomorrow" : "in " + u.diff + " days",
      when: DAYS[u.day.getDay()] + ", " + MONTHS[u.day.getMonth()] + " " + u.day.getDate() + " at " + fmtTime(u.time),
    }));
}

/* Fit the lists to the screen. Drop order when space is short:
   Later Today from the end (keeping its first item), then Not Today from the end,
   then the first Later Today item last. A heading left with no items is hidden. */
function fitLater() {
  const wrap = $("laterWrap");
  wrap.querySelectorAll("h2, li").forEach(e => { e.hidden = false; });
  const fits = () => wrap.scrollHeight <= wrap.clientHeight + 1;
  const hideHeadings = () => wrap.querySelectorAll("h2").forEach(h => {
    const ol = h.nextElementSibling;
    h.hidden = !ol || !ol.querySelector("li:not([hidden])");
  });
  const later = [...wrap.querySelectorAll(".path:not(.upcoming) li")];
  const ups = [...wrap.querySelectorAll(".upcoming li")];
  const order = later.slice(1).reverse().concat(ups.reverse(), later.slice(0, 1));
  for (const li of order) {
    if (fits()) break;
    li.hidden = true;
    hideHeadings();
  }
}

/* Size the pill text so the longest possible label fills the card on one line; every state uses that same size */
const LABELS = ["Next", "Coming Up Soon", "Now", "Tomorrow", ...SCHEDULE.map(s => s.instruction).filter(Boolean)];
function fitTag() {
  const tag = $("tag");
  const probe = document.createElement("span");
  probe.style.cssText = "position:fixed;left:0;top:0;visibility:hidden;white-space:nowrap;font-size:100px;font-family:" +
    getComputedStyle(tag).fontFamily + ";font-weight:" + getComputedStyle(tag).fontWeight;
  document.body.appendChild(probe);
  let widest = 0;
  for (const l of LABELS) { probe.textContent = l; widest = Math.max(widest, probe.getBoundingClientRect().width); }
  probe.remove();
  const avail = tag.clientWidth;               // full card width
  const size = avail / (widest / 100 + 1);     // + 1em for the pill's side padding
  tag.style.fontSize = Math.floor(size * 0.97) + "px";
  fitDay();
}

/* Size "Today is …" so the longest day name fills the card's width on one line */
function fitDay() {
  const el = $("day");
  const probe = document.createElement("span");
  probe.style.cssText = "position:fixed;left:0;top:0;visibility:hidden;white-space:nowrap;font-size:100px;font-family:" +
    getComputedStyle(el).fontFamily + ";font-weight:" + getComputedStyle(el).fontWeight;
  document.body.appendChild(probe);
  let widest = 0;
  for (const d of DAYS) { probe.textContent = "Today is " + d; widest = Math.max(widest, probe.getBoundingClientRect().width); }
  probe.remove();
  const avail = $("card").getBoundingClientRect().width;
  $("clock").style.fontSize = Math.floor(avail / (widest / 100) * 0.97) + "px";
}
window.addEventListener("resize", () => { fitTag(); fitLater(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitTag(); fitLater(); });

/* Keep the screen awake where allowed */
let lock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; }); } } catch (e) { lock = null; }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { render(); keepAwake(); } });
document.addEventListener("pointerdown", keepAwake);

if (typeof window !== "undefined" && document.getElementById("card")) {
  render();
  fitTag();
  fitLater();
  keepAwake();
  setInterval(render, 1000);
}
</script>

</body>
</html>
